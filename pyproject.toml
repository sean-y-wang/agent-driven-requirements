[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-bitable-bot"
version = "1.0.0"
description = "Agent-Driven Requirements: agent-driven requirements management & progress tracking (Feishu/Lark 需求小助手 + Bitable + progress-sync)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "lark-oapi>=1.4",
  "pydantic>=2.6",
  "openai>=1.30",
  "PyYAML>=6",
  "dateparser>=1.2",
  "structlog>=24",
]

[project.urls]
Homepage = "https://github.com/sean-y-wang/agent-driven-requirements"
Repository = "https://github.com/sean-y-wang/agent-driven-requirements"
Documentation = "https://github.com/sean-y-wang/agent-driven-requirements#readme"
Issues = "https://github.com/sean-y-wang/agent-driven-requirements/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "time-machine>=2.13", "ruff>=0.5"]

[project.scripts]
personal-agent = "bitable_bot.personal_agent.cli:main"
bitable-bot = "bitable_bot.main:main"
progress-sync = "bitable_bot.requirements_v09.progress:main"
requirements-reports = "bitable_bot.requirements_v09.reports:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitable_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
