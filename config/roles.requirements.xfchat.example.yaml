# xfchat (i讯飞) variant of roles.requirements.v09.yaml
# Extend the existing requirements scenario; table IDs default to xfchat bitable (overridable via env).
version: 1
scenario: requirements
dedicated: true
bot_name: 需求小助手
react_on_mention: true
react_emoji: DONE
query_docs_hint: 打开需求表查看更多：https://YOUR_TENANT.xfchat.iflytek.com/base/bascnEXAMPLE?table=tblREQUIREMENTS
timezone: Asia/Shanghai
llm:
  default: private
  fallback: []
  providers:
    openai:
      type: openai_compatible
      base_url: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
      supports_json_schema: true
    qwen:
      type: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: ${DASHSCOPE_API_KEY}
      model: qwen-plus
      fallback_models:
      - qwen-turbo
    deepseek:
      type: openai_compatible
      base_url: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}
      model: deepseek-chat
    private:
      type: openai_compatible
      base_url: https://maas-api.cn-huabei-1.xf-yun.com/v2
      api_key: ${PRIVATE_LLM_KEY}
      model: xopdeepseekv4pro
session:
  timeout_minutes: 1440
  max_followups: 2
chats_allowlist: []
audit_store_text: true
p2p_enabled: true
ack_after_seconds: 2
first_guide_enabled: true
first_guide_text: 直接说需求标题和背景，确认后收录；也可问我查进展。
intent:
  enabled: true
  min_confidence: 0.6
context:
  enabled: true
  recent_messages: 5
  include_parent: true
  include_thread: true
  thread_messages: 20
  max_chars: 3000
remote_config:
  enabled: false
  app_token: ''
  table_id: ''
  refresh_seconds: 300
roles:
- command: /提需求
  aliases:
  - /需求
  - /req
  name: 需求小助手
  description: 收集产品需求、功能建议、优化想法；也可查询已有需求进展
  confirm_before_write: true
  queryable: true
  query:
    search_fields:
    - title
    reply_fields:
    - title
    - status
    - priority
    - proposer
    - due
    max_candidates: 20
    max_reply: 2
    fallback_limit: 30
  min_content_chars: 12
  system_prompt: '你是「需求小助手」，帮产品收集需求。优先抽出：标题、背景/描述、所属项目、优先级、期望上线。

    可结合聊天上下文（前文几句）理解并提炼，但不要编造用户没提过的事实。

    用户若在闲聊或只说「记一下」而无实质内容，对应字段填 null 并放入 missing。

    '
  guide_prompt: '想提需求的话，请尽量说清这几项（可一条消息写完）：

    1）标题（一句话） 2）背景/要解决什么 3）优先级（P0–P3） 4）期望上线日期

    例：@我 SparkAudio API 要支持流式返回，给开放平台用，P1，期望下月中

    '
  reply_style: 简洁、条目化，少客套
  receipt_title: 需求已收录
tables:
  requirements:
    app_token: ${REQUIREMENTS_APP_TOKEN:-bascnEXAMPLE}
    table_id: ${REQUIREMENTS_TABLE_ID:-tblREQUIREMENTS}
    fields:
    - key: title
      field: 需求标题
      type: text
      required: true
      max_len: 100
      description: 一句话概括需求
    - key: desc
      field: 需求描述
      type: text
      required: false
      description: 需求的详细背景和内容（可综合聊天上下文）
    - key: project
      field: 所属模块
      type: single_select
      default: null
      options:
      - value: AIPaaS 4.0
      - value: AICloud Labs
    - key: type
      field: 需求类型
      type: single_select
      default: 新功能
      options:
      - value: 新功能
      - value: 优化
        synonyms:
        - 改进
        - 体验
      - value: 缺陷
        synonyms:
        - bug
        - 问题
        - 报错
      - value: 技术债
        synonyms:
        - 重构
    - key: priority
      field: 优先级
      type: single_select
      options:
      - value: P0
      - value: P1
      - value: P2
      - value: P3
      default: P2
      options:
      - value: P0
        synonyms:
        - 紧急
        - 最高
      - value: P1
        synonyms:
        - 高
      - value: P2
        synonyms:
        - 中
      - value: P3
        synonyms:
        - 低
    - key: due
      field: 期望上线日期
      type: date
      required: false
    - key: proposer
      field: 提出人
      type: text
      required: false
      default: $sender_name
      description: 提出需求的人；没明确提到其他人就留空
    - key: proposer_account
      field: 提出人账号
      type: user
      required: false
      default: $sender
    - key: dept
      field: 提出部门
      type: multi_select
      llm: false
      description: 第一次提需时问一次，之后沿用（成员配置表 / 本地缓存）
      options:
      - value: 消费者-生态
        synonyms: [生态]
      - value: 消费者-办公
        synonyms: [办公]
      - value: 汽车座舱
        synonyms: [汽车, 座舱]
      - value: 输入法
      - value: 研究院
    - key: assignee
      field: 需求受理人
      type: user
      llm: false
    - key: plan_date
      field: 计划上线日期
      type: date
      llm: false
    - key: attachments
      field: 附件
      type: attachment
      llm: false
    - &id001
      key: status
      field: 状态
      type: single_select
      default: 待评审
      options:
      - value: 待分诊
      - value: 待评审
      - value: 进行中
      - value: 阻塞
      - value: 已完成
      - value: 已关闭
    - key: source
      field: 来源群
      type: text
      default: $chat_name
    - key: raw_text
      field: 原始消息
      type: text
      default: $raw_text
    - key: context
      field: 上下文摘录
      type: text
      default: $context
    - key: message_link
      field: 消息链接
      type: url
      default: $message_link
    - key: submitted_at
      field: 提交时间
      type: date
      default: $now
    - &id004
      key: review
      field: 复核标记
      type: checkbox
      default: false
    - &id003
      key: agent
      field: 来源智能体
      type: single_select
      options:
      - value: Claude Code
      - value: Codex
      - value: Orca
      - value: 群
      - value: 其他
    - key: created_at
      llm: false
      field: 创建时间
      type: date
    - key: project_sel
      llm: false
      field: 所属项目
      type: single_select
      options:
      - value: AIPaaS 4.0
    - key: feature_module
      llm: false
      field: 功能模块
      type: single_select
      options:
      - value: AICloud Labs
    - key: product_module
      llm: false
      field: 产品模块
      type: single_select
      options:
      - value: ASE（模型发布）
      - value: AICloud（门户体验）
      - value: Nexus（计量授权）
    - key: task_links
      llm: false
      field: 关联开发需求
      type: link
    - key: progress_links
      llm: false
      field: 关联进展
      type: link
  tasks:
    app_token: ${REQUIREMENTS_APP_TOKEN:-bascnEXAMPLE}
    table_id: ${TASKS_TABLE_ID:-tblTASKS}
    fields:
    - key: title
      field: 任务标题
      type: text
    - key: requirement
      field: 需求记录标识
      type: text
    - &id002
      key: module
      field: 所属模块
      type: single_select
      options:
      - value: AIPaaS 4.0
      - value: AICloud Labs
    - key: participants
      field: 参与人
      type: user
    - key: status
      field: 状态
      type: single_select
      options:
      - value: 待分诊
      - value: 待评审
      - value: 进行中
      - value: 阻塞
      - value: 已完成
      - value: 已关闭
      - value: 待排期
      - value: 待开发
      - value: 开发中
      - value: 测试中
      - value: 待验收
      - value: 已上线
      - value: 已暂停
    - key: product
      field: 产品
      type: user
    - key: dev
      field: 开发
      type: user
    - key: test
      field: 测试
      type: user
    - key: plan_date
      field: 计划上线日期
      type: date
    - key: project
      field: 所属项目
      type: single_select
      options:
      - value: AIPaaS 4.0
    - key: dev_date
      field: 开发日期
      type: date
    - key: goal
      field: 任务目标
      type: text
    - key: req_link
      field: 来源业务需求
      type: link
    - key: progress_links
      field: 关联进展日志
      type: link
    - key: deps
      field: 依赖任务
      type: link
    - key: open_deps
      field: 未完成依赖
      type: number
    - key: ext_link
      field: 关联外部依赖
      type: link
    - key: feature_module
      field: 功能模块
      type: single_select
      options:
      - value: AICloud Labs
    - key: product_module
      field: 产品模块
      type: single_select
      options:
      - value: ASE（模型发布）
      - value: AICloud（门户体验）
      - value: Nexus（计量授权）
    - key: design
      field: 设计稿
      type: attachment
    - key: docs
      field: 文档
      type: attachment
  progress:
    app_token: ${REQUIREMENTS_APP_TOKEN:-bascnEXAMPLE}
    table_id: ${PROGRESS_TABLE_ID:-tblPROGRESS}
    fields:
    - key: task
      field: 任务记录标识
      type: text
    - *id002
    - key: author
      field: 记录人
      type: user
    - key: day
      field: 日期
      type: text
    - key: summary
      field: 进展摘要
      type: text
    - *id003
    - *id004
    - key: sync_key
      field: 同步键
      type: text
    - key: risk
      field: 风险
      type: text
    - key: source_message
      field: 来源消息标识
      type: text
    - key: tag
      field: 标签
      type: single_select
      options:
      - value: 进展
      - value: 风险
      - value: 风险解除
      - value: 待办
      - value: 排期变更
    - key: req_link
      field: 关联业务需求
      type: link
    - key: task_link
      field: 任务
      type: link
    - key: project
      field: 所属项目
      type: single_select
      options:
      - value: AIPaaS 4.0
    - key: feature_module
      field: 功能模块
      type: single_select
      options:
      - value: AICloud Labs
    - key: source
      field: 来源
      type: single_select
      options:
      - value: Claude Code
      - value: Codex
      - value: 飞书群
      - value: 飞书私聊
      - value: 手动
    - key: review_state
      field: 复核状态
      type: single_select
      options:
      - value: 待复核
      - value: 已复核
  modules:
    app_token: ${REQUIREMENTS_APP_TOKEN:-bascnEXAMPLE}
    table_id: ${MODULES_TABLE_ID:-tblMODULES}
    fields:
    # xfchat: primary field cannot be single_select (1254012), so 所属模块 is text here
    - key: module
      field: 所属模块
      type: text
    - key: project
      field: 项目名称
      type: text
    - key: repository
      field: 仓库地址
      type: text
  members:
    app_token: ${REQUIREMENTS_APP_TOKEN:-bascnEXAMPLE}
    table_id: ${MEMBERS_TABLE_ID:-tblMEMBERS}
    fields:
    - key: name
      field: 姓名
      type: text
    - key: member
      field: 成员
      type: user
    - key: role
      field: 角色
      type: single_select
      options:
      - value: 管理者
      - value: 产品运营
      - value: 参与者
      - value: 需求方
    - key: dept
      field: 提出部门
      type: single_select
      options:
      - value: 消费者-生态
      - value: 消费者-办公
      - value: 汽车座舱
      - value: 输入法
      - value: 研究院
    - key: note
      field: 备注
      type: text
  # 外部依赖（PRD 1.3）：我们向外部团队提的需求，和被阻塞任务双向关联
  external:
    app_token: ${REQUIREMENTS_APP_TOKEN:-bascnEXAMPLE}
    table_id: ${EXTERNAL_TABLE_ID:-tblEXTERNAL}
    fields:
    - key: title
      field: 依赖事项
      type: text
    - key: provider
      field: 提供方
      type: single_select
      options:
      - value: 引擎
    - key: status
      field: 状态
      type: single_select
      options:
      - value: 待提出
      - value: 已提出
      - value: 已排期
      - value: 已交付
      - value: 已拒绝
    - key: desc
      field: 需求说明
      type: text
    - key: impact
      field: 不提供的影响
      type: text
    - key: priority
      field: 优先级
      type: single_select
      options:
      - value: P0
      - value: P1
      - value: P2
      - value: P3
    - key: blocked
      field: 被阻塞任务
      type: link
    - key: owner
      field: 我方负责人
      type: user
    - key: counterpart
      field: 对方接口人
      type: user
    - key: raised_at
      field: 提出日期
      type: date
    - key: promise_date
      field: 承诺交付日期
      type: date
    - key: follow_link
      field: 跟进链接
      type: url
# 延期通知：计划上线日期已过且未上线 → 私聊需求受理人（无则提出人账号）；每条记录每个计划日期只提醒一次
overdue_notify:
  enabled: false
  dry_run: true
  hour: 10
  done_statuses: [已上线, 已完成, 已关闭]
intake:
  # 安全默认：关闭群旁路采集。要开群进展时必须同时 true + 非空 observed_chats，
  # 且应用已开「读取群全部消息」；不要在未配置目标群时盲开。
  # 2026-11-03：总开关开，但每个群默认不监听；白名单用户在群里 @机器人「开启监听/关闭监听/监听状态」
  # 按群开关持久化在 /data/bot.db 的 observe_chats 表。疑似需求只发确认卡，提出人确认才入池。
  observe_groups: true
  all_messages_permission: true
  observed_chats: []
  observe_admins:
  - ou_REPLACE_ADMIN
